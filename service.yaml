apiVersion: v1
kind: Service
metadata:
  name: menu-app-service
  labels:
    app: menu-app
spec:
  type: NodePort 
  selector:
    app: menu-app
    version: green
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 4173
      nodePort: 30007 # Puerto para acceder desde la IP de la VM
