apiVersion: v1
kind: Service
metadata:
  name: menu-app-service
  labels:
    app: menu-app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4173"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort 
  selector:
    app: menu-app
    version: green
  ports:
    - name: metrics
      protocol: TCP
      port: 80
      targetPort: 4173
      nodePort: 30007 # Puerto para acceder desde la IP de la VM
