# Valores para kube-prometheus-stack (Prometheus + Alertmanager + Grafana).
# helm install monitoring-stack prometheus-community/kube-prometheus-stack -n monitoring -f monitoring/values.yaml
prometheus:
  service:
    type: NodePort
    nodePort: 30090
alertmanager:
  service:
    type: NodePort
    nodePort: 30093
  alertmanagerSpec:
    # Toma los AlertmanagerConfig que lleven esta label (ver alertmanagerconfig.yaml)
    alertmanagerConfigSelector:
      matchLabels:
        alertmanagerConfig: menu-app
grafana:
  adminPassword: admin   # solo para el entorno de práctica
  service:
    type: NodePort
    nodePort: 30030
