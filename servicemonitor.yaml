apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: menu-app-monitor
  namespace: monitoring
  labels:
    release: monitoring-stack
spec:
  namespaceSelector:
      matchNames:
        - default
  selector:
    matchLabels:
      app: menu-app
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s