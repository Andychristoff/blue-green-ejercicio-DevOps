apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kyverno, falco]
  autogen:
    podControllers:
      controllers: [deployments, replicasets, statefulsets, daemonsets, jobs, cronjobs]
  variables:
  - name: containers
    expression: >-
      object.spec.containers +
      (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
  - expression: >-
      variables.containers.all(c,
        c.image.substring(c.image.lastIndexOf('/') + 1).contains(':') &&
        !c.image.endsWith(':latest'))
    message: "Las imagenes tienen que tener una etiqueta fija, no se permite latest ni dejarla sin etiqueta."
